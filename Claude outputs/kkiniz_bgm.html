<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>끼니즈 게임 음악 미리듣기</title>
<style>body{margin:0;padding:20px;background:#F6F1E7;color:#1B1B1B;font-family:system-ui,sans-serif}h1{font-size:20px;margin:0 0 4px}p{font-size:13px;color:#6B6357;margin:0 0 16px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}button{font:inherit;font-size:14px;font-weight:700;padding:14px 8px;background:#FFFDF8;border:3px solid #1B1B1B;border-radius:8px;box-shadow:3px 3px 0 #1B1B1B;cursor:pointer}
button.on{background:#FBBF24}#stop{margin-top:16px;width:100%;background:#1B1B1B;color:#FFF}small{display:block;font-weight:400;font-size:11px;color:#6B6357;margin-top:3px}</style></head><body>
<h1>끼니즈 게임 음악 미리듣기</h1><p>게임 이름을 누르면 그 게임의 배경음악이 나와. 폰이 무음이면 소리를 켜줘.</p><div class="g"><button data-s="quiz">음식 초성퀴즈<small></small></button><button data-s="pick">음식 골라먹기<small></small></button><button data-s="rope">줄넘기<small></small></button><button data-s="shoe">실내화 던지기<small></small></button><button data-s="tug">줄다리기<small></small></button><button data-s="run">운동회 장애물 달리기<small></small></button><button data-s="ox">내 몸 OX 퀴즈<small></small></button><button data-s="shuffle">뒤죽박죽 메뉴<small></small></button><button data-s="twenty">음식 스무고개<small></small></button><button data-s="blank">빈칸 메뉴<small></small></button><button data-s="tycoon">추억의 매점 타이쿤<small></small></button></div><button id="stop">멈춤</button><button data-x="lose" style="margin-top:10px;width:100%">효과음: 목숨 다 잃고 끝</button><button data-x="clear" style="margin-top:10px;width:100%">효과음: 시간 다 채우고 끝</button><button data-x="best" style="margin-top:10px;width:100%">효과음: 신기록</button>
<script>try{localStorage.setItem('fb_snd','1')}catch(e){}</script><script>// 🎵 끼니즈 소리 · 코드로 만드는 8비트 음악 (음원 파일 없음 · 전부 직접 지은 곡)
//   KSnd.bgm('quiz')  게임 배경음악 시작 (게임마다 다른 곡)
//   KSnd.stop()       멈춤
//   KSnd.sfx('end')   짧은 효과음
//   KSnd.on() / KSnd.set(true|false)   켬·끔 (기기에 저장 · fb_snd)
// 악보: 한 칸 = 8분음표 · '-' 이어서 · '.' 쉼 · 마디는 | · 화음은 마디마다 (반 마디씩은 'F/G')
(function () {
  'use strict';
  // 곡마다 다른 풍 · wave(멜로디 음색) · bar(한 마디 칸 수) · span(화음 하나가 가는 칸 수) · swing(뒷박 늦추기) · stab(화음 찍기) · echo(메아리)
  const SONGS = {
    // 통통 튀는 기본 8비트
    quiz: { bpm: 120, bass: 'oom', drum: 'k.h.s.h.k.h.s.hh', arp: 1, chords: 'C Am F G C Am G C',
      lead: 'e5 g5 c6 g5 e5 g5 a5 - | a5 c6 e6 c6 a5 - g5 - | f5 a5 c6 a5 f5 a5 g5 f5 | g5 - b5 - d6 - . . | e5 g5 c6 g5 e5 g5 a5 - | c6 b5 a5 g5 a5 - e5 - | f5 - a5 g5 f5 e5 d5 - | c5 - . g5 c6 - . .' },
    // 디스코 · 옥타브로 뛰는 베이스에 쿵쿵쿵쿵
    pick: { bpm: 150, wave: 'sawtooth', bass: 'oct', drum: 'k.h.kshhk.h.kshh', arp: 0, chords: 'G Em C D G Em C G',
      lead: 'd5 g5 b5 g5 d5 g5 b5 d6 | e5 g5 b5 g5 e5 - b5 - | c5 e5 g5 e5 c6 b5 a5 g5 | a5 - f#5 - d5 - . . | d5 g5 b5 g5 d6 - b5 - | e6 d6 b5 g5 e5 - g5 - | c6 - b5 a5 g5 f#5 e5 d5 | g5 - . d5 g5 - . .' },
    // 스윙 · 깡충깡충
    rope: { bpm: 126, wave: 'pulse', swing: 0.3, bass: 'oom', drum: 'k...s...k...s...', stab: '..x.', arp: 0, chords: 'F F Bb C F Dm Bb/C F',
      lead: 'f5 . a5 . c6 . a5 . | f5 a5 c6 a5 f5 - . . | bb5 . d6 . bb5 . g5 . | c6 - e5 g5 c6 - . . | f5 . a5 . c6 . f6 . | d6 - a5 f5 d5 - a5 - | bb5 a5 g5 f5 g5 - e5 - | f5 - c5 - f5 - . .' },
    // 살금살금 · 느리고 메아리
    shoe: { bpm: 100, wave: 'triangle', echo: 1, bass: 'walk', drum: 'k.....h.....s...', arp: 0, chords: 'Dm Dm Gm A Dm Bb Gm/A Dm',
      lead: 'd5 - f5 - a5 - f5 - | d5 e5 f5 a5 d6 - . . | g5 - bb5 - d6 - bb5 - | a5 - c#6 - e6 - . . | d6 - a5 - f5 - d5 - | bb5 - d6 bb5 f5 - d5 - | g5 a5 bb5 g5 a5 - e5 - | d5 - . a4 d5 - . .' },
    // 풍물 장단 (세 박씩 덩 쿵 덕) · 다섯 음 가락 · 영차! 하고 쉬는 자리
    tug: { bpm: 156, wave: 'sawtooth', vib: 1, bar: 12, span: 6, bass: 'drone', drum: 'D.....k...s.k...s.k...s.', arp: 0, chords: 'G G G G G D Em G D D G G Em D G G',
      lead: 'd5 - e5 g5 - a5 b5 - a5 g5 - e5 | d5 - e5 g5 - - . . . g5 a5 b5 | d6 - b5 a5 - g5 a5 - b5 a5 - g5 | e5 - g5 d5 - - . . . d5 e5 g5 | a5 - a5 b5 - d6 e6 - d6 b5 - a5 | g5 - a5 b5 - - . . . b5 a5 g5 | e5 - g5 a5 - b5 a5 - g5 e5 - d5 | g5 - - g5 - - g5 - - . . .' },
    // 질주 · 제일 빠름
    run: { bpm: 168, bass: 'drive', drum: 'k.h.s.h.k.h.s.h.', arp: 1, oct: -1, chords: 'A A D E A F#m D/E A',
      lead: 'a5 c#6 e6 c#6 a5 c#6 e6 a6 | e6 - c#6 - a5 - e5 - | d6 f#6 a6 f#6 d6 - f#6 - | e6 g#6 b6 g#6 e6 - . . | a5 c#6 e6 c#6 a6 - e6 - | f#6 e6 c#6 a5 f#5 - a5 - | d6 c#6 d6 f#6 e6 d6 b5 g#5 | a5 - . e5 a5 - . .' },
    // 째깍째깍 퀴즈쇼 · 짧게 끊는 음
    ox: { bpm: 126, wave: 'pulse', stac: 0.45, bass: 'tick', drum: 'k.h.h.h.h.h.h.h.', arp: 0, chords: 'Em Em Am B Em C Am/B Em',
      lead: 'e5 . g5 . b5 . g5 . | e5 g5 b5 e6 b5 - . . | a5 . c6 . e6 . c6 . | b5 - d#6 - f#6 - . . | e6 d6 b5 g5 e5 - g5 - | c6 - e6 c6 g5 - e5 - | a5 c6 e6 c6 b5 d#6 f#6 d#6 | e6 - b5 - e5 - . .' },
    // 뒷박에 화음을 찍는 느긋한 풍
    shuffle: { bpm: 118, bass: 'skank', drum: 'k...h.s.k...h.s.', stab: '.x.x', arp: 0, chords: 'D Bm G A D Bm G/A D',
      lead: 'd5 f#5 a5 d6 c#6 a5 f#5 a5 | b5 - f#5 d5 b4 - d5 f#5 | g5 b5 d6 g6 f#6 d6 b5 g5 | a5 - c#6 e6 a5 - . . | f#5 a5 d6 a5 f#6 - d6 - | d6 b5 f#5 b5 d6 - f#5 - | g5 a5 b5 d6 e6 c#6 a5 e5 | d5 - a5 - d6 - . .' },
    // 수수께끼 왈츠 (세 박자)
    twenty: { bpm: 132, wave: 'triangle', echo: 1, bar: 6, span: 6, bass: 'waltz', stab: '..x.x.', drum: 'k...h...h...', arp: 0, chords: 'Am Am Dm E Am F E Am',
      lead: 'a4 - c5 - e5 - | a5 - - - g#5 - | a5 - f5 - d5 - | e5 - - - . . | c5 - e5 - a5 - | c6 - - - a5 - | b5 - g#5 - e5 - | a4 - - - . .' },
    // 오르골 · 북 없이 높은 음
    blank: { bpm: 104, wave: 'triangle', echo: 1, oct: 1, bass: 'slow', drum: '', arp: 1, chords: 'F Dm Bb C F Dm Gm/C F',
      lead: 'a5 - c6 - f5 - a5 - | d5 - f5 a5 d6 - a5 - | bb5 - d6 - f5 - bb5 - | g5 - e5 g5 c6 - . . | c6 - a5 - f5 - c5 - | d5 f5 a5 - f5 - d5 - | g5 bb5 d6 bb5 g5 e5 c5 e5 | f5 - . c5 f5 - . .' },
    // 래그타임 · 쿵짝쿵짝 바쁜 매점
    tycoon: { bpm: 150, bass: 'oom', drum: 'k...s...k...s.h.', stab: '.x.x', arp: 0, chords: 'C G Am F C G F/G C',
      lead: 'g5 e5 c5 e5 g5 c6 e6 c6 | d6 b5 g5 b5 d6 - b5 - | c6 a5 e5 a5 c6 e6 c6 a5 | a5 - f5 a5 c6 - . . | e6 - c6 g5 e5 g5 c6 e6 | d6 - b5 g5 d5 g5 b5 d6 | c6 a5 f5 a5 d6 b5 g5 b5 | c6 - e6 - c6 - . .' },
  };
  const SEMI = { c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11 };
  function midi(tok) {   // 'c#5' · 'bb4' → 미디 번호
    const m = /^([a-g])(#|b)?(\d)$/.exec(tok); if (!m) return null;
    return 12 * (Number(m[3]) + 1) + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  }
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  function chord(name) {   // 'F#m' → { root: 미디(2옥타브), tri: [0,3,7] }
    const m = /^([A-G])(#|b)?(m)?$/.exec(name); if (!m) return null;
    const root = 36 + SEMI[m[1].toLowerCase()] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
    return { root, tri: m[3] ? [0, 3, 7] : [0, 4, 7] };
  }
  // 악보를 한 번만 풀어둠 · { step(8분음표 길이), lead:[{at,len,n}], chords:[반 마디마다 16개] }
  const parsed = {};
  function parse(id) {
    if (parsed[id]) return parsed[id];
    const s = SONGS[id]; if (!s) return null;
    const toks = s.lead.replace(/\|/g, ' ').trim().split(/\s+/), lead = [];
    toks.forEach((t, i) => {
      if (t === '-') { if (lead.length) lead[lead.length - 1].len++; return; }
      if (t === '.') return;
      const n = midi(t); if (n != null) lead.push({ at: i, len: 1, n: n + 12 * (s.oct || 0) });
    });
    const chords = [];
    s.chords.trim().split(/\s+/).forEach(c => { const p = c.split('/'); if (s.span) chords.push(chord(p[0])); else chords.push(chord(p[0]), chord(p[1] || p[0])); });
    return (parsed[id] = { s, steps: toks.length, lead, chords });
  }

  let ctx = null, master = null, noise = null, timer = null, cur = null, wantId = null;
  let enabled = true; try { enabled = localStorage.getItem('fb_snd') !== '0'; } catch (_) {}
  function boot() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    try {
      ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
      const len = ctx.sampleRate * 0.5; noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (_) { ctx = null; return false; }
    return true;
  }
  function tone(type, f, t, dur, vol, out, f2) {   // f2 를 주면 그 음까지 미끄러짐
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.setValueAtTime(vol, t + Math.max(0.01, dur * 0.6)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out || master); o.start(t); o.stop(t + dur + 0.02);
  }
  function hit(kind, t, out) {
    if (kind === 'k') {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle';
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.11);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.15); return;
    }
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); src.buffer = noise;
    const snare = kind === 's', dur = snare ? 0.12 : 0.035;
    f.type = snare ? 'bandpass' : 'highpass'; f.frequency.value = snare ? 1800 : 7000;
    g.gain.setValueAtTime(snare ? 0.22 : 0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(out); src.start(t, Math.random() * 0.3, dur + 0.02);
  }
  const BASS = {   // 화음 하나가 가는 동안 칠 음 · 화음에서 몇 번째 음인지 (null = 쉼 · 'o' = 한 옥타브 위)
    oom: [0, null, 2, null], drive: [0, 0, 0, 0], march: [0, null, 0, null], walk: [0, null, 1, 2], oct: [0, 'o', 0, 'o'], tick: [0, null, null, null],
    skank: [0, null, null, 2], slow: [0, null, null, null], waltz: [0, null, null, null, null, null], drone: [0, null, null, 2, null, null],
  };
  const VOL = { square: 0.085, pulse: 0.1, triangle: 0.2, sawtooth: 0.06 };
  let pulseWave = null;
  function lead(s, f, t, dur, run) {   // 멜로디 한 음
    const o = ctx.createOscillator(), g = ctx.createGain(), w = s.wave || 'square', vol = VOL[w] || 0.085;
    if (w === 'pulse') {
      if (!pulseWave) { const N = 24, re = new Float32Array(N), im = new Float32Array(N); for (let n = 1; n < N; n++) re[n] = 2 / (n * Math.PI) * Math.sin(n * Math.PI * 0.2); pulseWave = ctx.createPeriodicWave(re, im); }
      o.setPeriodicWave(pulseWave);
    } else o.type = w;
    o.frequency.setValueAtTime(f, t);
    if (s.vib && dur > 0.15) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = 6; lg.gain.value = f * 0.012; l.connect(lg); lg.connect(o.frequency); l.start(t + 0.08); l.stop(t + dur + 0.02); }
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.setValueAtTime(vol, t + Math.max(0.01, dur * 0.6)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(run.lead); o.start(t); o.stop(t + dur + 0.02);
  }
  // 8분음표 한 칸을 예약
  function sched(run, i, t0) {
    const P = run.P, s = P.s, st = run.step, out = run.out, k = i % P.steps, bar = s.bar || 8, span = s.span || 4;
    const t = t0 + (s.swing && k % 2 ? st * s.swing : 0);
    P.lead.forEach(n => { if (n.at === k) lead(s, hz(n.n), t, n.len * st * (s.stac || 0.95), run); });
    const ch = P.chords[Math.floor(k / span) % P.chords.length];
    if (ch) {
      const b = (BASS[s.bass] || BASS.oom)[k % span];
      if (b != null) tone('triangle', hz(ch.root + (b === 'o' ? 12 : ch.tri[b])), t, st * (s.bass === 'slow' || s.bass === 'waltz' ? span * 0.9 : 0.9), 0.3, out);
      if (s.stab && s.stab[k % span] === 'x') ch.tri.forEach(x => tone('square', hz(ch.root + 24 + x), t, st * 0.5, 0.022, out));
      if (s.arp) for (let j = 0; j < 2; j++) tone('square', hz(ch.root + 24 + ch.tri[(k * 2 + j) % 3] + (((k * 2 + j) % 6) > 2 ? 12 : 0)), t0 + j * st / 2, st * 0.42, 0.022, out);
    }
    const d = s.drum || '';
    if (d) for (let j = 0; j < 2; j++) {
      const c = d[((k % bar) * 2 + j) % d.length]; if (!c || c === '.') continue;
      const dt = (s.swing && k % 2 ? t : t0) + j * st / 2;
      if (c === 'D') { hit('k', dt, out); hit('s', dt, out); } else hit(c, dt, out);
    }
  }
  function tick() {
    const run = cur; if (!run || !ctx) return;
    while (run.next < ctx.currentTime + 0.25) { sched(run, run.i, run.next); run.i++; run.next += run.step; }
  }
  function stop() {
    wantId = null; if (timer) { clearInterval(timer); timer = null; }
    const run = cur; cur = null;
    if (run && ctx) { try { run.out.gain.setTargetAtTime(0, ctx.currentTime, 0.04); setTimeout(() => { try { run.out.disconnect(); } catch (_) {} }, 600); } catch (_) {} }
  }
  function bgm(id) {
    stop(); wantId = id;
    if (!enabled || !SONGS[id] || document.hidden || !boot()) return;
    try { if (ctx.state === 'suspended') ctx.resume(); } catch (_) {}
    const P = parse(id), out = ctx.createGain(), step = 60 / P.s.bpm / 2; out.gain.value = 1; out.connect(master);
    const leadBus = ctx.createGain(); leadBus.connect(out);
    if (P.s.echo) { const dl = ctx.createDelay(1), fb = ctx.createGain(); dl.delayTime.value = step * 1.5; fb.gain.value = 0.3; leadBus.connect(dl); dl.connect(fb); fb.connect(out); fb.connect(dl); }
    cur = { P, out, lead: leadBus, step, i: 0, next: ctx.currentTime + 0.08 };
    tick(); timer = setInterval(tick, 60);
  }
  const SFX = {   // [음, 시작(초), 길이(초), 미끄러져 내려갈 음, 음색]
    clear: [['c5', 0, 0.1], ['e5', 0.1, 0.1], ['g5', 0.2, 0.1], ['c6', 0.3, 0.3]],   // 시간 다 채우고 끝 · 밝게 올라감
    best: [['g5', 0, 0.08], ['c6', 0.08, 0.08], ['e6', 0.16, 0.08], ['g6', 0.24, 0.08], ['e6', 0.32, 0.08], ['g6', 0.4, 0.35]],   // 신기록
    // 목숨을 다 잃고 끝 · 계단처럼 내려오다 축 처지고 바닥에 툭 (꼬르륵 꽈당)
    lose: [['g5', 0, 0.11], ['e5', 0.13, 0.11], ['c5', 0.26, 0.11], ['a4', 0.39, 0.11], ['g4', 0.54, 0.42, 'c4'], ['c3', 1.0, 0.22, 'g2', 'triangle']],
    ok: [['e6', 0, 0.06], ['a6', 0.06, 0.1]],
    bad: [['d#4', 0, 0.09], ['c4', 0.09, 0.16]],
  };
  function sfx(name) {
    if (!enabled || !SFX[name] || !boot()) return;
    try { if (ctx.state === 'suspended') ctx.resume(); } catch (_) {}
    const t = ctx.currentTime + 0.02; SFX[name].forEach(n => tone(n[4] || 'square', hz(midi(n[0])), t + n[1], n[2], n[4] ? 0.35 : 0.09, master, n[3] ? hz(midi(n[3])) : 0));
  }
  function set(v) { enabled = !!v; try { localStorage.setItem('fb_snd', enabled ? '1' : '0'); } catch (_) {} if (!enabled) stop(); }
  // 앱이 뒤로 가면 멈추고, 돌아오면 하던 곡을 다시
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { const id = wantId; stop(); wantId = id; } else if (wantId && !cur) bgm(wantId);
  });
  function unlock() { if (!enabled || !boot()) return; try { if (ctx.state === 'suspended') ctx.resume(); } catch (_) {} }   // 누르는 순간에 불러야 아이폰에서 소리가 남
  window.KSnd = { bgm, stop, sfx, set, unlock, on: () => enabled, songs: () => Object.keys(SONGS), _parse: parse };
})();
</script>
<script>document.querySelectorAll('[data-s]').forEach(b=>{b.querySelector('small').textContent='빠르기 '+KSnd._parse(b.dataset.s).s.bpm;b.onclick=()=>{KSnd.unlock();KSnd.bgm(b.dataset.s);document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));b.classList.add('on')}});
document.getElementById('stop').onclick=()=>{KSnd.stop();document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'))};document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{KSnd.stop();KSnd.sfx(b.dataset.x)});</script></body></html>
