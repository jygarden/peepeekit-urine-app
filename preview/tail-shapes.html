<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  body{background:#F5F6FA;padding:40px;font-family:-apple-system,sans-serif}
  .row{display:flex;gap:30px;flex-wrap:wrap}
  .item{background:#FFF;padding:16px;border-radius:16px;border:1px solid #E5E7EB;width:280px}
  .label{font-size:12px;font-weight:800;color:#64748B;margin-bottom:8px}
  .bubble{background:linear-gradient(135deg,#1E40AF,#3D63D9);height:120px;border-radius:16px;padding:20px;color:#FFF;font-weight:900}
  .tail-wrap{display:flex;justify-content:flex-end;margin-top:-1px;margin-right:36px}
</style>
</head>
<body>
<h2>말풍선 꼬리 라운드 비교</h2>
<div class="row">

  <div class="item">
    <div class="label">A · 긴 물방울</div>
    <div class="bubble">오늘 저녁, 타코 어때?</div>
    <div class="tail-wrap">
      <svg width="34" height="30" viewBox="0 0 34 30">
        <path d="M 0 0 C 0 20, 10 30, 20 28 C 28 24, 34 12, 34 0 Z" fill="#3D63D9"/>
      </svg>
    </div>
  </div>

  <div class="item">
    <div class="label">B · 짧고 통통 (로고 느낌)</div>
    <div class="bubble">오늘 저녁, 타코 어때?</div>
    <div class="tail-wrap">
      <svg width="38" height="26" viewBox="0 0 38 26">
        <path d="M 0 0 C 0 12, 8 22, 18 24 C 28 22, 36 12, 38 0 Z" fill="#3D63D9"/>
      </svg>
    </div>
  </div>

  <div class="item">
    <div class="label">C · 오른쪽 끝 짧은 혀</div>
    <div class="bubble">오늘 저녁, 타코 어때?</div>
    <div class="tail-wrap">
      <svg width="26" height="26" viewBox="0 0 26 26">
        <path d="M 0 0 C 2 14, 12 24, 20 20 C 22 10, 24 4, 26 0 Z" fill="#3D63D9"/>
      </svg>
    </div>
  </div>

  <div class="item">
    <div class="label">D · 로고 그대로 (더 둥글고 각 작음)</div>
    <div class="bubble">오늘 저녁, 타코 어때?</div>
    <div class="tail-wrap">
      <svg width="32" height="22" viewBox="0 0 32 22">
        <path d="M 0 0 Q 2 18, 16 22 Q 30 14, 32 0 Z" fill="#3D63D9"/>
      </svg>
    </div>
  </div>

</div>
</body>
</html>
