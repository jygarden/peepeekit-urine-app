<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#1E3A8A"/>
<title>건강어때 · 식단 함께 보기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"/>
<style>
  :root{--navy:#1E3A8A;--navy2:#1E40AF;--blue:#2563EB;--bg:#F7F9FC;--card:#FFF;--border:#E5E7EB;--muted:#64748B;--text:#0F172A;--yellow:#F59E0B;--yellow-bg:#FEF3C7;--danger:#DC2626}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--text);word-break:keep-all;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer}
  input,textarea{font-family:inherit;font-size:14px;border:1px solid var(--border);border-radius:10px;padding:11px 13px;width:100%;background:#FFF;color:var(--text);outline:none}
  input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  textarea{resize:vertical;min-height:70px}
  /* 상단 바 */
  .topbar{position:sticky;top:0;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#FFF;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;z-index:10;box-shadow:0 2px 10px rgba(30,58,138,.15)}
  .topbar .logo{font-weight:900;font-size:16px;letter-spacing:-.3px}
  .topbar .logo span{color:var(--yellow)}
  .topbar .user{font-size:12px;opacity:.9;display:flex;align-items:center;gap:8px}
  .topbar .logout{background:rgba(255,255,255,.15);color:#FFF;border:0;padding:6px 11px;border-radius:8px;font-size:11.5px;font-weight:700}
  .container{max-width:720px;margin:0 auto;padding:18px 16px 60px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(15,23,42,.04)}
  .btn{display:inline-block;background:var(--blue);color:#FFF;border:0;padding:13px 18px;border-radius:11px;font-weight:800;font-size:14px;width:100%}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-ghost{background:#FFF;color:var(--blue);border:1.5px solid var(--blue)}
  .btn-danger{background:var(--danger)}
  .btn-sm{padding:7px 11px;font-size:11.5px;width:auto;border-radius:8px}
  .label{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:6px;display:block}
  .err{background:#FEF2F2;color:#991B1B;border:1px solid #FECACA;padding:9px 11px;border-radius:9px;font-size:12.5px;margin:8px 0;display:none}
  .err.show{display:block}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .divider{height:1px;background:var(--border);margin:14px 0}
  h1{font-size:22px;font-weight:900;margin-bottom:4px;letter-spacing:-.5px}
  h2{font-size:16px;font-weight:900;margin-bottom:10px}
  h3{font-size:14px;font-weight:800;margin-bottom:8px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .tabs{display:flex;gap:6px;margin-bottom:14px;background:#F1F5F9;padding:4px;border-radius:10px}
  .tabs button{flex:1;background:transparent;border:0;padding:9px;border-radius:7px;font-weight:800;font-size:13px;color:var(--muted)}
  .tabs button.active{background:#FFF;color:var(--navy);box-shadow:0 2px 6px rgba(15,23,42,.08)}
  .member-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:#FFF;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer}
  .member-row:hover{border-color:var(--blue)}
  .member-name{font-weight:800;font-size:14px}
  .member-meta{font-size:11px;color:var(--muted);margin-top:3px}
  .badge{display:inline-block;background:var(--yellow-bg);color:#92400E;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:800;margin-left:6px}
  .meal-card{background:#FAFBFF;border:1px solid #E0E7FF;border-radius:12px;padding:12px;margin-bottom:10px}
  .meal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .meal-time{font-size:11px;color:var(--muted);font-weight:700}
  .meal-badge{background:var(--navy);color:#FFF;padding:2px 6px;border-radius:4px;font-size:9.5px;font-weight:800;text-transform:uppercase}
  .meal-foods{font-size:13px;font-weight:800;color:var(--text);margin:4px 0}
  .meal-nutr{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
  .meal-memo{background:#FEFCE8;border-left:3px solid var(--yellow);padding:7px 10px;margin-top:8px;border-radius:4px;font-size:12px;color:#78350F}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:40px 20px;background:#F8FAFC;border-radius:12px}
  .back-btn{background:transparent;border:0;color:var(--blue);font-weight:700;font-size:13px;padding:0;margin-bottom:10px;display:inline-flex;align-items:center;gap:4px}
  @media (max-width:420px){h1{font-size:19px}.container{padding:14px 12px 50px}}
</style>
</head>
<body>

<!-- ═══ 로그인 / 가입 ═══ -->
<div id="viewAuth" class="container" style="padding-top:60px">
  <div style="text-align:center;margin-bottom:28px">
    <div style="font-size:30px;margin-bottom:6px">🤝</div>
    <h1>건강어때 · 식단 함께 보기</h1>
    <div class="sub">친구·연인·가족·PT와 식단을 공유하고 코칭하세요</div>
  </div>
  <div class="card">
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchAuthTab('login')">로그인</button>
      <button id="tabSignup" onclick="switchAuthTab('signup')">가입</button>
    </div>
    <div id="authErr" class="err"></div>

    <div id="paneLogin">
      <label class="label">이메일</label>
      <input id="loginEmail" type="email" placeholder="trainer@gym.com" autocomplete="email"/>
      <div style="height:10px"></div>
      <label class="label">비밀번호</label>
      <input id="loginPassword" type="password" placeholder="8자 이상" autocomplete="current-password"/>
      <div style="height:14px"></div>
      <button class="btn" onclick="doLogin()">로그인</button>
    </div>

    <div id="paneSignup" style="display:none">
      <label class="label">이름</label>
      <input id="signName" type="text" placeholder="홍길동" maxlength="40"/>
      <div style="height:10px"></div>
      <label class="label">이메일</label>
      <input id="signEmail" type="email" placeholder="trainer@gym.com" autocomplete="email"/>
      <div style="height:10px"></div>
      <label class="label">비밀번호 (8자 이상)</label>
      <input id="signPassword" type="password" placeholder="영문·숫자 조합 추천" autocomplete="new-password"/>
      <div style="height:10px"></div>
      <label class="label">관계·소속 (선택)</label>
      <input id="signGym" type="text" placeholder="예: 홍길동 PT · 친구 · 엄마" maxlength="60"/>
      <div style="height:14px"></div>
      <button class="btn" onclick="doSignup()">가입하고 시작</button>
      <div class="hint">* 가입 시 서비스 이용약관 및 개인정보 처리방침에 동의한 것으로 간주됩니다.</div>
    </div>
  </div>
  <div class="hint" style="text-align:center;margin-top:14px">
    상대가 발급한 공유 코드를 입력하면<br/>그 사람 식단을 매일 확인하고 코멘트할 수 있어요.
  </div>
</div>

<!-- ═══ 메인 (로그인 후) ═══ -->
<div id="viewApp" style="display:none">
  <div class="topbar">
    <div class="logo">건강어때 <span>·</span> 식단 함께 보기</div>
    <div class="user">
      <span id="hdrName">—</span>
      <button class="logout" onclick="doLogout()">로그아웃</button>
    </div>
  </div>

  <div class="container">
    <!-- 대시보드 · 내가 보는 사람들 -->
    <div id="viewDashboard">
      <h2>👥 내가 보는 사람들</h2>
      <div class="card">
        <label class="label">공유 코드로 추가 (친구·연인·회원 모두)</label>
        <div style="display:flex;gap:8px;align-items:stretch">
          <input id="addCodeInput" type="text" placeholder="HLT-A3K9XQ" maxlength="12" style="text-transform:uppercase;letter-spacing:1px"/>
          <button class="btn" style="width:auto;padding:11px 18px" onclick="doAddMember()">추가</button>
        </div>
        <div id="addMemberErr" class="err"></div>
      </div>

      <div id="membersList"></div>
    </div>

    <!-- 상세 · 선택된 사람 -->
    <div id="viewMember" style="display:none">
      <button class="back-btn" onclick="showDashboard()">← 목록으로</button>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <h2 id="memberHeader" style="margin:0">—</h2>
        <button onclick="renameMember()" title="별명 수정" style="background:#F1F5F9;border:0;color:#64748B;padding:5px 9px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer">✏️ 별명</button>
      </div>
      <div class="sub" id="memberMeta"></div>

      <div class="card">
        <h3>✍️ 메시지 남기기 (상대방에게 보임)</h3>
        <textarea id="generalMemoInput" placeholder="예: 오늘 단백질 좀 더 챙겨요~ · 저녁은 가볍게!" maxlength="1000"></textarea>
        <div style="height:8px"></div>
        <button class="btn" onclick="doAddGeneralMemo()">메시지 보내기</button>
      </div>

      <h3 style="margin:14px 2px 10px">🍽 최근 식단 (최대 30개)</h3>
      <div id="memberMealsList"></div>
      <div id="memberMealsEmpty" class="empty" style="display:none">아직 식단 기록이 없어요.</div>
    </div>
  </div>
</div>

<script>
// ═══ 상태 ═══
const COACH_LS_TOKEN = 'coachToken';
const COACH_LS_TRAINER = 'coachTrainer';
let currentMemberId = null;

// ═══ 공통 ═══
function $(id){return document.getElementById(id)}
function showErr(id, msg){const e=$(id);if(!e)return alert(msg);e.textContent='⚠️ '+msg;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),6000)}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(method, path, body){
  const headers={'Content-Type':'application/json'};
  const tok=localStorage.getItem(COACH_LS_TOKEN);
  if(tok) headers['Authorization']='Bearer '+tok;
  const opts={method,headers};
  if(body!==undefined) opts.body=JSON.stringify(body);
  const r=await fetch(path, opts);
  const t=await r.text();
  let j; try{j=JSON.parse(t)}catch(e){j={error:t.slice(0,200)}}
  if(r.status===401){ doLogout(); throw new Error('로그인 세션 만료'); }
  if(!r.ok) throw new Error(j.error||`HTTP ${r.status}`);
  return j;
}

// ═══ 인증 뷰 ═══
function switchAuthTab(which){
  $('tabLogin').classList.toggle('active', which==='login');
  $('tabSignup').classList.toggle('active', which==='signup');
  $('paneLogin').style.display = which==='login' ? '' : 'none';
  $('paneSignup').style.display = which==='signup' ? '' : 'none';
}

async function doLogin(){
  const email=$('loginEmail').value.trim();
  const password=$('loginPassword').value;
  if(!email||!password) return showErr('authErr','이메일/비밀번호 입력');
  try{
    const r=await api('POST','/api/coach-login',{email,password});
    _saveSession(r.token, r.trainer);
    enterApp();
  }catch(e){ showErr('authErr', e.message); }
}

async function doSignup(){
  const name=$('signName').value.trim();
  const email=$('signEmail').value.trim();
  const password=$('signPassword').value;
  const gym_name=$('signGym').value.trim();
  if(!name||!email||!password) return showErr('authErr','필수 항목을 모두 입력');
  if(password.length<8) return showErr('authErr','비밀번호는 8자 이상');
  try{
    const r=await api('POST','/api/coach-register',{name,email,password,gym_name});
    _saveSession(r.token, r.trainer);
    enterApp();
  }catch(e){ showErr('authErr', e.message); }
}

function _saveSession(token, trainer){
  localStorage.setItem(COACH_LS_TOKEN, token);
  localStorage.setItem(COACH_LS_TRAINER, JSON.stringify(trainer));
}
function _loadSession(){
  const tok=localStorage.getItem(COACH_LS_TOKEN);
  const tStr=localStorage.getItem(COACH_LS_TRAINER);
  if(!tok||!tStr) return null;
  try{ return { token:tok, trainer: JSON.parse(tStr) }; }catch(e){ return null; }
}
function doLogout(){
  localStorage.removeItem(COACH_LS_TOKEN);
  localStorage.removeItem(COACH_LS_TRAINER);
  $('viewAuth').style.display='';
  $('viewApp').style.display='none';
}
function enterApp(){
  const s=_loadSession();
  if(!s){ return doLogout(); }
  $('hdrName').textContent = s.trainer.name + (s.trainer.gym_name?` · ${s.trainer.gym_name}`:'');
  $('viewAuth').style.display='none';
  $('viewApp').style.display='';
  showDashboard();
  loadMembers();
}

// ═══ 대시보드 ═══
function showDashboard(){
  $('viewDashboard').style.display='';
  $('viewMember').style.display='none';
  currentMemberId=null;
}

async function loadMembers(){
  const list=$('membersList');
  list.innerHTML='<div class="hint">불러오는 중…</div>';
  try{
    const r=await api('GET','/api/coach-members');
    const members=r.members||[];
    if(!members.length){
      list.innerHTML='<div class="empty">아직 아무도 등록 안 됐어요.<br/>상대가 보내준 공유 코드를 위에서 입력해주세요.</div>';
      return;
    }
    list.innerHTML = members.map(m=>{
      const lastH = m.last_meal_at ? _hoursAgo(m.last_meal_at) : null;
      const lastStr = lastH===null ? '식단 없음' : (lastH<1 ? '방금' : (lastH<24 ? lastH+'시간 전' : Math.floor(lastH/24)+'일 전'));
      return `<div class="member-row" onclick="openMember('${m.user_id}','${escapeHtml(m.nickname)}')">
        <div style="flex:1;min-width:0">
          <div class="member-name">${escapeHtml(m.nickname)}
            ${m.meals_last_7d>0?`<span class="badge">7일 ${m.meals_last_7d}끼</span>`:''}
          </div>
          <div class="member-meta">마지막 식단: ${lastStr} · 등록 ${new Date(m.granted_at).toLocaleDateString('ko-KR')}</div>
        </div>
        <div style="color:#CBD5E1;font-size:18px">›</div>
      </div>`;
    }).join('');
  }catch(e){
    list.innerHTML = `<div class="err show">${e.message}</div>`;
  }
}
function _hoursAgo(iso){ return Math.floor((Date.now()-new Date(iso).getTime())/3600000); }

async function doAddMember(){
  const code=$('addCodeInput').value.trim().toUpperCase();
  if(!/^HLT-[A-Z0-9]{6,10}$/.test(code)) return showErr('addMemberErr','형식: HLT-A3K9XQ');
  try{
    await api('POST','/api/coach-members',{code});
    $('addCodeInput').value='';
    loadMembers();
  }catch(e){ showErr('addMemberErr', e.message); }
}

// ═══ 회원 상세 ═══
async function openMember(userId, nickname){
  currentMemberId = userId;
  $('viewDashboard').style.display='none';
  $('viewMember').style.display='';
  $('memberHeader').textContent = nickname;
  $('memberMeta').textContent = '';
  $('memberMealsList').innerHTML = '<div class="hint">불러오는 중…</div>';
  $('memberMealsEmpty').style.display = 'none';
  try{
    const r=await api('GET',`/api/coach-member-meals?user_id=${encodeURIComponent(userId)}&limit=30`);
    const meals=r.meals||[];
    const gm=r.general_memos||[];
    const gmHtml = gm.length ? ('<div class="card"><h3>이전 메시지</h3>' + gm.slice(0,5).map(m=>`<div style="padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px"><div style="color:var(--muted);font-size:10.5px;margin-bottom:2px">${new Date(m.created_at).toLocaleString('ko-KR')}${m.mine?' · 나':''}</div>${escapeHtml(m.text)}</div>`).join('')+'</div>') : '';
    if(!meals.length){
      $('memberMealsList').innerHTML = gmHtml;
      $('memberMealsEmpty').style.display='block';
      return;
    }
    $('memberMealsList').innerHTML = gmHtml + meals.map(m=>_renderMeal(m)).join('');
  }catch(e){
    $('memberMealsList').innerHTML = `<div class="err show">${e.message}</div>`;
  }
}

function _renderMeal(m){
  const foods=(m.foods||[]).map(f=>escapeHtml(f.name||'음식')+(f.portion&&f.portion!==1?` ×${f.portion}`:'')).join(' · ');
  const t=m.totals||{};
  const nutr = [
    t.kcal?`${Math.round(t.kcal)} kcal`:null,
    t.protein_g?`단백질 ${Math.round(t.protein_g)}g`:null,
    t.carbs_g?`탄수 ${Math.round(t.carbs_g)}g`:null,
    t.fat_g?`지방 ${Math.round(t.fat_g)}g`:null,
    t.sodium_mg?`나트륨 ${Math.round(t.sodium_mg)}mg`:null
  ].filter(Boolean).join(' · ');
  const mt = m.meal_time ? {breakfast:'아침',lunch:'점심',dinner:'저녁',snack:'간식'}[m.meal_time] : '';
  const when = new Date(m.consumed_at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const store = m.store_tag && m.store_tag.title ? `<div class="meal-time">📍 ${escapeHtml(m.store_tag.title)}</div>` : '';
  const memo = m.user_memo ? `<div class="meal-time">💬 ${escapeHtml(m.user_memo)}</div>` : '';
  const memos = (m.memos||[]).map(x=>`<div class="meal-memo">${escapeHtml(x.text)}${x.mine?' · 내 메모':''}</div>`).join('');
  return `<div class="meal-card">
    <div class="meal-head">
      <div class="meal-time">${when}${mt?' · <b>'+mt+'</b>':''}</div>
      ${mt?`<span class="meal-badge">${mt}</span>`:''}
    </div>
    <div class="meal-foods">${foods||'음식 정보 없음'}</div>
    ${nutr?`<div class="meal-nutr">${nutr}</div>`:''}
    ${store}${memo}${memos}
    <div style="display:flex;gap:6px;margin-top:9px">
      <input id="memoInput_${m.id}" placeholder="이 식단에 코치 메모…" style="font-size:12px;padding:7px 10px"/>
      <button class="btn btn-sm" onclick="doAddMealMemo('${m.id}')">저장</button>
    </div>
  </div>`;
}

async function renameMember(){
  if (!currentMemberId) return;
  const cur = $('memberHeader').textContent;
  const name = prompt(`"${cur}"의 별명을 입력하세요 (최대 40자):\n\n빈 칸으로 두면 이용자 닉네임으로 복귀`, cur);
  if (name === null) return;
  try{
    const r = await api('PATCH','/api/coach-members',{user_id:currentMemberId,display_name:name});
    $('memberHeader').textContent = r.display_name || cur;
  }catch(e){ alert('⚠️ '+e.message); }
}

async function doAddMealMemo(mealId){
  const inp=$('memoInput_'+mealId);
  const text=(inp?.value||'').trim();
  if(!text) return;
  try{
    await api('POST','/api/coach-member-meals',{user_id:currentMemberId,meal_log_id:mealId,text,visible_to_user:true});
    inp.value='';
    openMember(currentMemberId, $('memberHeader').textContent);
  }catch(e){ alert('⚠️ '+e.message); }
}

async function doAddGeneralMemo(){
  const text=$('generalMemoInput').value.trim();
  if(!text) return;
  try{
    await api('POST','/api/coach-member-meals',{user_id:currentMemberId,text,visible_to_user:true});
    $('generalMemoInput').value='';
    openMember(currentMemberId, $('memberHeader').textContent);
  }catch(e){ alert('⚠️ '+e.message); }
}

// ═══ 초기화 ═══
(function init(){
  const s=_loadSession();
  if(s){ enterApp(); } else { $('viewAuth').style.display=''; }
  // 코드 입력창 자동 대문자
  const ci=$('addCodeInput');
  if(ci) ci.addEventListener('input', e=>e.target.value=e.target.value.toUpperCase());
})();
</script>
</body>
</html>
